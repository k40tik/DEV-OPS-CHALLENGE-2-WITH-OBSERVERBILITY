<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>EVENT registration</title>
</head>
<body>
    <main class="page-shell">
        <section class="registration-card" aria-labelledby="page-title">
            <div class="card-intro">
                <p class="eyebrow">EVENT REGISTRATION</p>
                <h1 id="page-title">Save your seat.</h1>
                <p class="intro-copy">Join us for an experience worth showing up for. Enter your details to complete your registration.</p>
            </div>

            <form class="registration-form" id="registration-form" action="/api/event-registration" method="POST">
                <div class="field-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Alex Morgan" autocomplete="name" required>
                </div>

                <div class="field-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" pattern="[A-Za-z0-9.!#$%&amp;'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+" title="Enter a valid email address, such as you@example.com" required>
                </div>

                <button type="submit" id="submit-btn">Register now <span aria-hidden="true">&#8594;</span></button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
